# FluxBridge release pipeline.
#
# Triggered by pushing a SemVer tag (vX.Y.Z). It builds the optimized Windows
# GUI binary, packages it as both a portable .zip and an Inno Setup installer
# (.exe), and publishes a GitHub Release with both assets attached. The in-app
# updater (crates/updater) polls the GitHub Releases API and prefers the `.exe`
# asset, so the Setup installer it downloads is the one this workflow uploads.
#
# This job runs on GitHub's hosted windows-latest runner, NOT in the Linux dev
# sandbox. It is validated here only as YAML.
#
# NOTE: this workflow file is merged via PULL REQUEST only. It is edited in the
# working tree here but never pushed directly to a default branch by the agent.

name: release

# Run on version tags only. Both globs match SemVer tags like v1.2.0; the
# second is kept explicit per the plan so three-part tags are clearly covered.
on:
  push:
    tags:
      - "v*"
      - "v*.*.*"

# The release step needs write access to create the GitHub Release.
permissions:
  contents: write

jobs:
  windows-release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      # 1. Check out the tagged commit.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install a stable Rust toolchain.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 3. Cache the cargo registry and target dir to speed up repeat builds.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      # 3b. Derive the release version from the pushed tag and expose it to the
      #     build. github.ref_name is the tag (for example v0.4.0); the leading
      #     `v` is stripped so the value is a bare SemVer (0.4.0). build.rs reads
      #     FLUXBRIDGE_RELEASE_VERSION and re-emits it as FLUXBRIDGE_BUILD_VERSION,
      #     which src/main.rs prefers over CARGO_PKG_VERSION. This makes the
      #     shipped binary report exactly the tag it was built at, so the updater
      #     never re-offers an already-installed release (the infinite-loop fix)
      #     even if the workspace version in Cargo.toml was not bumped.
      - name: Derive release version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "FLUXBRIDGE_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 3c. Provision a prebuilt SHARED FFmpeg so the `decode` feature links.
      #     ffmpeg-next v7 (ffmpeg-sys-next) compiles against the libav
      #     development headers/import libraries and uses bindgen/libclang, so
      #     it needs both an FFmpeg dev tree (FFMPEG_DIR) and libclang
      #     (LIBCLANG_PATH). This mirrors the ffmpeg-next maintainer's own
      #     Windows CI: set LIBCLANG_PATH from Visual Studio's bundled LLVM
      #     (found via vswhere) and download the gyan.dev
      #     ffmpeg-release-full-shared build (FFmpeg 7.x, matching ffmpeg-next
      #     7.1.0). Because it is a SHARED build the avcodec/avformat/avutil/
      #     swscale/swresample (plus avfilter/avdevice/postproc) DLLs it ships
      #     in ffmpeg\bin MUST travel next to fluxbridge-desktop.exe at runtime
      #     (staged into target\release by a later step), or the app will not
      #     start. The extracted folder is versioned (ffmpeg-*), so it is
      #     normalized into a stable `ffmpeg` directory to keep FFMPEG_DIR and
      #     the bin\ PATH entry deterministic. The guard fails the job early -
      #     in the same defensive style as the scrcpy jar validation below - if
      #     the download or extraction did not produce a usable ffmpeg\bin with
      #     avcodec*.dll.
      - name: Provision FFmpeg (shared) for the decode feature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # bindgen/libclang: point at Visual Studio's bundled LLVM via vswhere.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -property installationPath
          if (-not $vsInstall) {
            throw "Could not locate a Visual Studio installation via vswhere; LIBCLANG_PATH cannot be set for ffmpeg-sys-next (bindgen)."
          }
          $libclangPath = Join-Path $vsInstall "VC\Tools\LLVM\x64\bin"
          if (-not (Test-Path (Join-Path $libclangPath "libclang.dll"))) {
            throw "libclang.dll not found under '$libclangPath'. The VS bundled LLVM component is required for ffmpeg-sys-next bindgen."
          }

          # Download and extract the gyan.dev prebuilt SHARED FFmpeg build.
          $ffmpegRoot = "$env:RUNNER_TEMP\ffmpeg-dl"
          New-Item -ItemType Directory -Force -Path $ffmpegRoot | Out-Null
          $archive = Join-Path $ffmpegRoot "ffmpeg-release-full-shared.7z"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z" `
            -OutFile $archive
          if (-not (Test-Path $archive)) {
            throw "FFmpeg download failed: ffmpeg-release-full-shared.7z was not written to $archive."
          }

          # windows-latest ships 7z (7z.exe) preinstalled.
          7z x $archive "-o$ffmpegRoot" -y | Out-Null

          # Normalize the versioned extracted dir (ffmpeg-*-full_build-shared)
          # into a stable `ffmpeg` directory so FFMPEG_DIR is deterministic.
          $ffmpegDir = Join-Path $ffmpegRoot "ffmpeg"
          if (Test-Path $ffmpegDir) { Remove-Item -Recurse -Force $ffmpegDir }
          $extracted = Get-ChildItem -Path $ffmpegRoot -Directory |
            Where-Object { $_.Name -like "ffmpeg-*" } | Select-Object -First 1
          if (-not $extracted) {
            throw "FFmpeg extraction failed: no 'ffmpeg-*' directory found under $ffmpegRoot."
          }
          Rename-Item -Path $extracted.FullName -NewName "ffmpeg"

          # Guard: the shared build MUST contain the runtime DLLs in bin\.
          $binDir = Join-Path $ffmpegDir "bin"
          $avcodec = Get-ChildItem -Path $binDir -Filter "avcodec*.dll" -ErrorAction SilentlyContinue
          if (-not $avcodec) {
            throw "FFmpeg provisioning looks broken: no avcodec*.dll found in '$binDir'. The decode feature cannot link or run without the shared FFmpeg DLLs."
          }

          # Export FFMPEG_DIR + LIBCLANG_PATH for the build, and add ffmpeg\bin
          # to PATH so the DLLs resolve during any tooling that runs the exe.
          "FFMPEG_DIR=$ffmpegDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBCLANG_PATH=$libclangPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "FFmpeg provisioned at $ffmpegDir (bin has $($avcodec.Name)); LIBCLANG_PATH=$libclangPath."

      # 4. Build the optimized production binary.
      #    LTO and stripped debug symbols come from [profile.release] in the
      #    workspace Cargo.toml (lto=true, codegen-units=1, strip=true,
      #    panic="abort"), so this is just a plain --release build. The desktop
      #    GUI lives behind the OFF-by-default `gui` cargo feature, so the
      #    release build MUST enable it to produce the actual windowed client.
      #    build.rs embeds assets/icon.ico into the .exe on Windows via the
      #    Windows-only `embed-resource` build dependency.
      #    FLUXBRIDGE_RELEASE_VERSION (set in the previous step) flows into
      #    build.rs so the binary self-reports the tag version.
      #
      #    This ships BOTH `gui` and `decode`: the real FFmpeg H.264 decode path
      #    (the `decode` feature, backed by ffmpeg-next) is now part of the
      #    Windows release, so mirrored frames are decoded to real pixels
      #    instead of the pure-Rust StubDecoder's empty output. The preceding
      #    "Provision FFmpeg (shared)" step makes ffmpeg-next link by setting
      #    FFMPEG_DIR and LIBCLANG_PATH; the following "Stage FFmpeg runtime
      #    DLLs" step copies the shared-build DLLs next to the exe so it runs.
      #    `decode` is still OFF by default and NOT implied by `gui`, so the
      #    headless `cargo build --workspace` / `--features gui` builds stay
      #    green with no libav dependency.
      - name: Build release binary (GUI + decode)
        run: cargo build --release --features gui,decode --bin fluxbridge-desktop

      # 4a. Stage the FFmpeg shared-build runtime DLLs next to the exe.
      #     The decode feature links a SHARED FFmpeg, so the avcodec/avformat/
      #     avutil/swscale/swresample (and avfilter/avdevice/postproc) DLLs must
      #     sit beside fluxbridge-desktop.exe at runtime or Windows fails to
      #     start the process. Copy every *.dll from the provisioned
      #     ffmpeg\bin into target\release so both the portable zip and the
      #     installer pick them up from there. Globbing all DLLs is robust to
      #     FFmpeg's per-release version suffixes (avcodec-61, avutil-59, etc.).
      #     The guard fails the job if the core libav DLLs did not land.
      - name: Stage FFmpeg runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binDir = Join-Path $env:FFMPEG_DIR "bin"
          New-Item -ItemType Directory -Force -Path target\release | Out-Null
          Copy-Item -Path (Join-Path $binDir "*.dll") -Destination target\release -Force
          foreach ($prefix in @("avcodec", "avutil", "avformat", "swscale")) {
            $found = Get-ChildItem -Path target\release -Filter "$prefix*.dll" -ErrorAction SilentlyContinue
            if (-not $found) {
              throw "FFmpeg DLL staging incomplete: no $prefix*.dll in target\release. The decode build would not run without the shared FFmpeg runtime DLLs beside the exe."
            }
          }
          $dlls = Get-ChildItem -Path target\release -Filter "*.dll"
          Write-Host "Staged $($dlls.Count) FFmpeg DLLs into target\release: $(( $dlls | ForEach-Object { $_.Name } ) -join ', ')."

      # 4b. Obtain the upstream scrcpy server jar and stage it next to the .exe.
      #     The mirroring pipeline pushes this jar to the device and resolves it
      #     relative to the executable directory (PipelineConfig::resolve_server_jar
      #     in crates/desktop/src/pipeline.rs), and the installer bundles it from
      #     target\release\scrcpy-server.jar (see installer/fluxbridge.iss). The
      #     .jar is the MIT-licensed upstream scrcpy-server and is deliberately
      #     NOT vendored into this repository, so CI fetches the release asset
      #     whose version matches SCRCPY_SERVER_VERSION ("5.0.1") in
      #     crates/desktop/src/adb.rs. If the pinned version ever changes, bump
      #     SCRCPY_VERSION here and SCRCPY_SERVER_VERSION in adb.rs together.
      #     scrcpy is MIT-licensed; its LICENSE is staged alongside the jar and
      #     shipped by the installer (and the portable zip) for compliance.
      - name: Fetch scrcpy server jar
        shell: pwsh
        env:
          SCRCPY_VERSION: "5.0.1"
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path target\release | Out-Null
          $base = "https://github.com/Genymobile/scrcpy/releases/download/v$env:SCRCPY_VERSION"
          $jarPath = "target\release\scrcpy-server.jar"
          $asset = "scrcpy-server-v$env:SCRCPY_VERSION"
          Invoke-WebRequest -Uri "$base/$asset" `
            -OutFile $jarPath
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Genymobile/scrcpy/v$env:SCRCPY_VERSION/LICENSE" `
            -OutFile "target\release\scrcpy-server-LICENSE"

          # Validate the downloaded jar BEFORE it is packaged. Invoke-WebRequest
          # writes whatever the server returns, so a GitHub outage serving an
          # HTML error page or a truncated/zero-byte response would otherwise be
          # shipped silently as a corrupt scrcpy-server.jar. A corrupt jar makes
          # the scrcpy server abort the moment it starts, which surfaces on the
          # client as "scrcpy dummy byte: failed to fill whole buffer" (the
          # stream handshake read reaches EOF immediately). Fail the release here
          # instead of shipping a broken jar.
          if (-not (Test-Path $jarPath)) {
            throw "scrcpy server download failed: expected asset '$asset' from $base was not written to $jarPath."
          }
          $size = (Get-Item $jarPath).Length
          # The real v5.0.1 asset is ~90 KB. Anything well under 10 KB is an
          # error page or a truncated download, not the jar.
          if ($size -lt 10000) {
            throw "scrcpy server download looks corrupt: '$asset' is only $size bytes (expected roughly 90 KB). This usually means GitHub served an error page or a truncated download."
          }
          # A real ZIP/JAR begins with the magic bytes 'PK' (0x50 0x4B). An HTML
          # error page would begin with '<' (0x3C), so this catches a bad body
          # even when it happens to be large.
          $magic = [System.IO.File]::ReadAllBytes($jarPath)[0..1]
          if ($magic[0] -ne 0x50 -or $magic[1] -ne 0x4B) {
            $hex = ('0x{0:X2} 0x{1:X2}' -f $magic[0], $magic[1])
            throw "scrcpy server download is not a valid jar: '$asset' does not start with the ZIP/JAR 'PK' magic bytes (got $hex). The download is probably an HTML error page or corrupt."
          }
          # Strengthen with the official checksum when the release publishes
          # SHA256SUMS.txt. The file lists one "<sha256>  <filename>" line per
          # asset; find the line for our asset, compare it to the computed hash,
          # and fail on mismatch. If the checksum list is unavailable the magic
          # byte and size checks above remain the hard gate.
          try {
            $sumsPath = "target\release\scrcpy-SHA256SUMS.txt"
            Invoke-WebRequest -Uri "$base/SHA256SUMS.txt" -OutFile $sumsPath
          } catch {
            Write-Host "SHA256SUMS.txt not available for v$env:SCRCPY_VERSION; relying on size and magic-byte validation."
            $sumsPath = $null
          }
          if ($sumsPath -and (Test-Path $sumsPath)) {
            $expectedLine = Get-Content $sumsPath | Where-Object { $_ -match "\b$([regex]::Escape($asset))$" } | Select-Object -First 1
            if (-not $expectedLine) {
              Write-Host "No SHA256 entry for '$asset' in SHA256SUMS.txt; relying on size and magic-byte validation."
            } else {
              $expected = ($expectedLine -split '\s+')[0].ToLower()
              $actual = (Get-FileHash -Algorithm SHA256 -Path $jarPath).Hash.ToLower()
              if ($expected -ne $actual) {
                throw "scrcpy server checksum mismatch for '$asset': expected $expected but downloaded file is $actual."
              }
              Write-Host "scrcpy server SHA256 verified for '$asset'."
            }
          }
          Write-Host "scrcpy server jar validated: $asset ($size bytes)."

      # 5. Package the portable .zip containing the built .exe, the scrcpy
      #    server jar beside it, AND the FFmpeg shared-build runtime DLLs, so
      #    the portable build can mirror AND decode without a separate download
      #    (resolve_server_jar looks next to the .exe, and Windows loads the
      #    avcodec/avutil/etc. DLLs from the exe directory). The target\release
      #    \*.dll glob picks up every FFmpeg DLL staged by the step above,
      #    robust to FFmpeg's per-release version suffixes.
      #    github.ref_name is the tag that triggered the run (for example v1.2.0).
      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path target\release\fluxbridge-desktop.exe, `
                  target\release\scrcpy-server.jar, `
                  target\release\scrcpy-server-LICENSE, `
                  target\release\*.dll `
            -DestinationPath "dist\FluxBridge-${{ github.ref_name }}-portable.zip" `
            -Force

      # 6. Install the Inno Setup compiler (ISCC) via Chocolatey.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      # 7. Compile installer/fluxbridge.iss into a Setup .exe.
      #    The version is passed through /DAppVersion so the installer's
      #    AppVersion and output filename track the tag. The ref_name keeps its
      #    leading 'v' here only for the human-facing wizard; the output file is
      #    named FluxBridge-Setup-<version>.exe by the script's OutputBaseFilename.
      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ github.ref_name }}" `
            installer\fluxbridge.iss

      # 8. Create the GitHub Release and attach both artifacts.
      #    softprops/action-gh-release reads the tag from github.ref automatically.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FluxBridge ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/FluxBridge-${{ github.ref_name }}-portable.zip
            dist/FluxBridge-Setup-${{ github.ref_name }}.exe
